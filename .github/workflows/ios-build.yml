name: ios-build
# kban の iOS アプリ(ios/)がビルドできるかを確認する。署名なしのシミュレータ向けビルド。
on:
  push:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && DEVELOPMENT_TEAM= xcodegen
      - run: |
          cd ios
          xcodebuild -project Kban.xcodeproj -scheme Kban -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
