# kban: PR・CI・デプロイの進み具合に合わせて Issue の kban:<工程> ラベルを自動で進める。
#   PR が開く            → テスト
#   kban-ci が成功     → デプロイ
#   プレビューのデプロイ成功(Vercel など) → 確認(プレビューURLを記録)
#   PR がマージ          → 完了
name: kban-flow

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  workflow_run:
    workflows: [kban-ci]
    types: [completed]
  deployment_status:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/kban
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/github-script@v7
        with:
          script: |
            const k = require(`${process.env.GITHUB_WORKSPACE}/.github/kban/resolve.js`);
            const ctx = { github, context, core };
            const p = context.payload;
            switch (context.eventName) {
              case "pull_request": {
                const pr = p.pull_request;
                if (p.action === "closed") {
                  if (pr.merged) await k.moveFromPr(ctx, pr, "done");
                } else {
                  await k.moveFromPr(ctx, pr, "testing", { key: "pr", value: pr.html_url });
                }
                break;
              }
              case "workflow_run": {
                if (p.workflow_run.conclusion !== "success" || p.workflow_run.event !== "pull_request") break;
                await k.moveFromPr(ctx, await k.prFromSha(ctx, p.workflow_run.head_sha), "deploying");
                break;
              }
              case "deployment_status": {
                const st = p.deployment_status;
                if (st.state !== "success" || /prod/i.test(p.deployment.environment || "")) break;
                const url = st.environment_url || st.target_url;
                await k.moveFromPr(ctx, await k.prFromSha(ctx, p.deployment.sha), "verifying", url ? { key: "preview", value: url } : undefined);
                break;
              }
            }
