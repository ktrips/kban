# kenban: PR の CI が通ったら TestFlight にアップロードし、カードを「確認」に進める。
name: kenban-testflight

on:
  workflow_run:
    workflows: [kenban-ci]
    types: [completed]

permissions:
  issues: write
  pull-requests: read
  contents: read

concurrency:
  group: kenban-testflight
  cancel-in-progress: false

jobs:
  beta:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install fastlane --no-document
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          KENBAN_SCHEME: ${{ vars.KENBAN_SCHEME }}
        run: fastlane beta
      - name: kenban → 確認
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const k = require(`${process.env.GITHUB_WORKSPACE}/.github/kenban/resolve.js`);
            const build = fs.existsSync("fastlane/kenban_build.txt") ? fs.readFileSync("fastlane/kenban_build.txt", "utf8").trim() : "";
            const pr = await k.prFromSha({ github, context, core }, context.payload.workflow_run.head_sha);
            await k.moveFromPr({ github, context, core }, pr, "verifying", { key: "preview", value: `TestFlight ${build}`.trim() });
