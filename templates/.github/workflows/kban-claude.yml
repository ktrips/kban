# kban: Issue に `claude` ラベルが付いたら Claude Code が実装して PR を作る。
# PR / Issue への `@claude` コメント(kban の「AIに差し戻す」)でも修正を続ける。
name: kban-claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: kban-claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: __RUNNER__
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: kban → 実装中
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const k = require(`${process.env.GITHUB_WORKSPACE}/.github/kban/resolve.js`);
            await k.moveIssue({ github, context, core }, context.issue.number, "building");

      - uses: anthropics/claude-code-action@v1
        with:
          # どちらか一方を Secrets に設定(Claude の契約なら claude setup-token で発行した OAuth トークン)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          trigger_phrase: "@claude"
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr comment:*),__TOOLS__"
