# kban: 「AIで優先順位」で起動する。Claude Code がバックログと「次にやる」を読み、順番・サイズ・理由・前提・並行可否の提案を
# 各カードの Issue に <!-- kban:proposal=… --> として書く。kban がそれを「AIの提案」として出し、採用するかを選ぶ。
# 認証は kban-claude.yml と同じ Secrets(Claude の契約の CLAUDE_CODE_OAUTH_TOKEN を優先、なければ ANTHROPIC_API_KEY)。
name: kban-prioritize

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kban-prioritize
  cancel-in-progress: true

jobs:
  prioritize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: kban → 指示を作る
        uses: actions/github-script@v7
        with:
          script: |
            const k = require(`${process.env.GITHUB_WORKSPACE}/.github/kban/resolve.js`);
            const prompt = await k.prioritizePrompt({ github, context, core });
            require("fs").writeFileSync(`${process.env.RUNNER_TEMP}/kban-prioritize-prompt.txt`, prompt);

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 読むだけ(Read / Glob / Grep)。コードは変えない
      - name: Claude Code で優先順位を考える
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          npx -y @anthropic-ai/claude-code@latest -p --output-format json --max-turns 30 --allowedTools "Read,Glob,Grep" \
            < "$RUNNER_TEMP/kban-prioritize-prompt.txt" > "$RUNNER_TEMP/kban-prioritize.json"

      - name: kban → 提案を各カードに書く
        uses: actions/github-script@v7
        env:
          OUT: ${{ runner.temp }}/kban-prioritize.json
        with:
          script: |
            const k = require(`${process.env.GITHUB_WORKSPACE}/.github/kban/resolve.js`);
            await k.applyPriorities({ github, context, core }, process.env.OUT);
