# kenban: iOS の CI(シミュレータでテスト)。名前 kenban-ci を変えると kenban-flow が追えなくなります。
name: kenban-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          SCHEME=$(jq -r .scheme .github/kenban/config.json)
          DEST="platform=iOS Simulator,name=$(jq -r '.simulator // "iPhone 16"' .github/kenban/config.json)"
          set -o pipefail
          xcodebuild test -scheme "$SCHEME" -destination "$DEST" CODE_SIGNING_ALLOWED=NO | xcbeautify
